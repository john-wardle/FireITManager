<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#174b76">
    <title>FireIT Mobile</title>
    <link rel="manifest" href="/mobile/manifest.webmanifest">
    <link rel="stylesheet" href="/mobile/styles.css">
</head>
<body>
<div class="app-shell">
    <header class="topbar">
        <div>
            <p class="eyebrow">FireIT Mobile</p>
            <h1 id="incident-title">Incident Field Tool</h1>
        </div>
        <div id="connection-pill" class="connection-pill offline">
            <span class="status-dot"></span>
            <span id="connection-text">Offline</span>
        </div>
    </header>

    <nav class="tabbar" aria-label="Mobile workspaces">
        <button class="tab active" data-view="overview">Overview</button>
        <button class="tab" data-view="search">Search</button>
        <button class="tab" data-view="checklists">Checklists</button>
        <button class="tab" data-view="active">Active</button>
        <button class="tab" data-view="guides">Guides</button>
    </nav>

    <main>
        <section id="view-overview" class="view active">
            <section class="summary-grid">
                <article class="metric-panel">
                    <span class="metric-label">Camps</span>
                    <strong id="camp-count">0</strong>
                </article>
                <article class="metric-panel">
                    <span class="metric-label">Devices</span>
                    <strong id="device-count">0</strong>
                </article>
                <article class="metric-panel">
                    <span class="metric-label">Links</span>
                    <strong id="link-count">0</strong>
                </article>
                <article class="metric-panel">
                    <span class="metric-label">Open Runs</span>
                    <strong id="open-run-count">0</strong>
                </article>
            </section>
            <section class="panel">
                <div class="section-heading">
                    <h2>Camp Summary</h2>
                    <button id="refresh-button" class="icon-button" type="button" aria-label="Refresh">Refresh</button>
                </div>
                <div id="camp-list" class="compact-list"></div>
            </section>
            <section class="panel">
                <h2>Link Status</h2>
                <div id="link-status-list" class="compact-list"></div>
            </section>
            <section class="panel">
                <h2>Device List</h2>
                <div id="device-list" class="compact-list"></div>
            </section>
        </section>

        <section id="view-search" class="view">
            <section class="panel">
                <label class="field-label" for="global-search">Search incident data</label>
                <input id="global-search" class="search-input" type="search" placeholder="Hostname, IP, MAC, asset, building, checklist">
            </section>
            <section class="panel">
                <h2>Results</h2>
                <div id="search-results" class="result-list"></div>
            </section>
        </section>

        <section id="view-checklists" class="view">
            <section class="panel">
                <div class="section-heading">
                    <h2>Standard ITSS Checklists</h2>
                    <span id="template-count" class="muted">0 available</span>
                </div>
                <div id="template-list" class="template-list"></div>
            </section>
        </section>

        <section id="view-active" class="view">
            <section class="panel">
                <div class="section-heading">
                    <h2>Active Checklist Runs</h2>
                    <button id="sync-button" class="icon-button" type="button">Sync</button>
                </div>
                <div id="run-list" class="run-list"></div>
            </section>
            <section id="run-detail" class="panel hidden"></section>
        </section>

        <section id="view-guides" class="view">
            <section class="panel">
                <h2>Troubleshooting Guides</h2>
                <div id="guide-list" class="guide-list"></div>
            </section>
            <section class="panel">
                <h2>Documentation Library</h2>
                <div id="doc-list" class="guide-list"></div>
            </section>
            <section class="panel">
                <h2>Contact / Escalation</h2>
                <div id="contact-list" class="guide-list"></div>
            </section>
        </section>
    </main>
</div>

<div id="toast" class="toast hidden" role="status"></div>
<script src="/mobile/app.js" defer></script>
</body>
</html>
