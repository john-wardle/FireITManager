<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FireIT Mobile Status</title>
    <style>
        :root {
            color-scheme: light dark;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #f5f7fa;
            color: #16202a;
        }

        main {
            max-width: 560px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0 0 16px;
        }

        .status {
            border: 1px solid #c7d1dd;
            border-radius: 8px;
            padding: 16px;
            background: #ffffff;
        }

        .state {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 999px;
            background: #8b949e;
        }

        .online .dot {
            background: #1f8f4d;
        }

        .offline .dot {
            background: #c9352b;
        }

        dl {
            display: grid;
            grid-template-columns: max-content 1fr;
            gap: 10px 14px;
            margin: 16px 0 0;
        }

        dt {
            color: #506070;
            font-weight: 600;
        }

        dd {
            margin: 0;
        }
    </style>
</head>
<body>
<main>
    <h1>FireIT Mobile Connection</h1>
    <section id="status" class="status offline">
        <div class="state">
            <span class="dot"></span>
            <span id="state-text">Checking server...</span>
        </div>
        <dl>
            <dt>Server</dt>
            <dd id="server-text">/health</dd>
            <dt>Live updates</dt>
            <dd>/hubs/incident</dd>
            <dt>Clients</dt>
            <dd id="client-count">Unknown</dd>
            <dt>Last check</dt>
            <dd id="last-check">Never</dd>
        </dl>
    </section>
</main>
<script>
    async function refreshStatus() {
        const status = document.getElementById("status");
        const stateText = document.getElementById("state-text");
        const serverText = document.getElementById("server-text");
        const clientCount = document.getElementById("client-count");
        const lastCheck = document.getElementById("last-check");

        try {
            const [healthResponse, connectionsResponse] = await Promise.all([
                fetch("/health", { cache: "no-store" }),
                fetch("/api/realtime/connections", { cache: "no-store" })
            ]);

            if (!healthResponse.ok || !connectionsResponse.ok) {
                throw new Error("Server returned an unhealthy response.");
            }

            const health = await healthResponse.json();
            const connections = await connectionsResponse.json();

            status.classList.remove("offline");
            status.classList.add("online");
            stateText.textContent = "Connected";
            serverText.textContent = `${health.service} (${health.databaseStatus})`;
            clientCount.textContent = connections.length.toString();
        } catch (error) {
            status.classList.remove("online");
            status.classList.add("offline");
            stateText.textContent = "Disconnected";
            serverText.textContent = "Server unavailable";
            clientCount.textContent = "Unknown";
        } finally {
            lastCheck.textContent = new Date().toLocaleTimeString();
        }
    }

    refreshStatus();
    window.setInterval(refreshStatus, 5000);
</script>
</body>
</html>
